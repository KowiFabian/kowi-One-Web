name: KOWI One-time dependency patch
on:
  push:
    branches: [feat/kowi-verifica-editorial-20261024]
    paths:
      - .github/workflows/patch-kowi-deps-once.yml
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'KowiFabian/kowi-One-Web'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/kowi-verifica-editorial-20261024
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install patched compatible versions and regenerate lockfile
        run: |
          npm install --save-exact next@15.5.28 zod@4.6.6
          npm install --save-dev --save-exact eslint-config-next@15.5.28
      - name: Check patched dependencies
        run: |
          npm audit --omit=dev
          npm test
          npm run type-check
          npm run lint
          npm run build
      - name: Commit checked package updates to isolated branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --staged --quiet || git commit -m "fix(security): patch Next.js and Zod and regenerate lockfile"
          git push origin HEAD:feat/kowi-verifica-editorial-20261024
